<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(fontes/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:M;src:url(fontes/montserrat-latin-700-normal.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;position:relative;overflow:hidden;background:#111;font-family:M}
.fundo{position:absolute;inset:0;background:url(media/protese3d/capa_fundo.png) no-repeat;background-size:1250px auto;background-position:-40px -20px}
.som{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,.15) 32%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%)}
.tag{position:absolute;top:300px;left:50%;transform:translateX(-50%);background:#32B64A;color:#fff;font-weight:800;font-size:38px;padding:12px 30px;border-radius:999px;letter-spacing:1px;white-space:nowrap}
.titulo{position:absolute;top:390px;width:100%;text-align:center;color:#fff;font-weight:800;font-size:118px;line-height:1;text-shadow:0 6px 0 #006B3C,0 18px 40px rgba(0,0,0,.6)}
.titulo span{color:#32B64A;text-shadow:0 6px 0 #0b3d22,0 18px 40px rgba(0,0,0,.6)}
.sub{position:absolute;top:1520px;left:50%;transform:translateX(-50%);background:#fff;color:#202020;font-weight:800;font-size:46px;padding:18px 34px;border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.45);white-space:nowrap}
.handle{position:absolute;bottom:200px;width:100%;text-align:center;color:#fff;font-weight:700;font-size:38px;opacity:.9}
</style></head><body>
<div class="fundo"></div><div class="som"></div>
<div class="tag">Fêmur curto congênito</div>
<div class="titulo">UMA PRÓTESE<br><span>PARA UM BEBÊ</span></div>
<div class="sub">Feita com impressão 3D</div>
<div class="handle">@centroamputadosrn</div>
</body></html>
